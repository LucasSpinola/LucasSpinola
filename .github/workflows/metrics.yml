name: Métricas do GitHub

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Painel geral
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasSpinola
          filename: metrics/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator
          repositories: 100
          config_timezone: America/Fortaleza
          config_display: large
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

      - name: Linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasSpinola
          filename: metrics/metrics.plugin.languages.svg
          base: ""
          repositories_affiliations: owner, collaborator
          repositories: 100
          config_timezone: America/Fortaleza
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

      - name: Calendário de contribuições
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasSpinola
          filename: metrics/metrics.plugin.isocalendar.svg
          base: ""
          config_timezone: America/Fortaleza
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
