<title id="title">Terminal de Lucas Spinola</title>
<desc id="desc">Janela de terminal Linux que digita o nome Lucas Spinola em ASCII art, o perfil em YAML com formação em Engenharia de Computação na UFRN, atuação em DevOps na Aiyra e em infraestrutura na inPACTA, foco em DevOps, backend e IA, e a pesquisa em PLN aplicado à educação.</desc>
